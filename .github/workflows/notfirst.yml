name: first workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  firstjob:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello world"
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: list files in the repository
        run: |
          echo "The repository ${{ github.repository }} contains the following files:"
          tree
  job1:
    runs-on: ubuntu-latest
    steps:
      - run: "echo job: ${{ github.job }}"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - run: "echo job: ${{ github.job }}"
  job3:
    runs-on: ubuntu-latest
    steps:
      - run: "echo job: ${{ github.job }}"
  job4:
    runs-on: ubuntu-latest
    needs: [job1, job3]
    steps:
      - run: "echo job: ${{ github.job }}"
  
